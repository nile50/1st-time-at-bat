<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GPT Chatbot</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f0f2f5;
      height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .chat-container {
      width: min(720px, 100%);
      height: 100dvh;
      display: flex;
      flex-direction: column;
      background: #fff;
      box-shadow: 0 4px 24px rgba(0,0,0,.10);
    }

    header {
      padding: 16px 20px;
      background: #10a37f;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }

    header h1 { font-size: 1.1rem; font-weight: 600; }

    #reset-btn {
      background: rgba(255,255,255,.2);
      border: none;
      color: #fff;
      border-radius: 6px;
      padding: 6px 12px;
      cursor: pointer;
      font-size: .85rem;
    }
    #reset-btn:hover { background: rgba(255,255,255,.35); }

    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .message {
      max-width: 78%;
      padding: 10px 14px;
      border-radius: 16px;
      line-height: 1.5;
      font-size: .95rem;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .message.user {
      align-self: flex-end;
      background: #10a37f;
      color: #fff;
      border-bottom-right-radius: 4px;
    }

    .message.assistant {
      align-self: flex-start;
      background: #f0f2f5;
      color: #1a1a1a;
      border-bottom-left-radius: 4px;
    }

    .message.error {
      align-self: center;
      background: #fee2e2;
      color: #b91c1c;
      font-size: .85rem;
    }

    .typing {
      align-self: flex-start;
      background: #f0f2f5;
      border-radius: 16px;
      border-bottom-left-radius: 4px;
      padding: 12px 16px;
      display: flex;
      gap: 5px;
      align-items: center;
    }
    .typing span {
      width: 8px; height: 8px;
      background: #999;
      border-radius: 50%;
      animation: bounce .9s infinite;
    }
    .typing span:nth-child(2) { animation-delay: .15s; }
    .typing span:nth-child(3) { animation-delay: .3s; }
    @keyframes bounce {
      0%, 80%, 100% { transform: translateY(0); }
      40% { transform: translateY(-6px); }
    }

    form {
      display: flex;
      gap: 10px;
      padding: 14px 16px;
      border-top: 1px solid #e5e7eb;
      flex-shrink: 0;
    }

    #user-input {
      flex: 1;
      border: 1px solid #d1d5db;
      border-radius: 10px;
      padding: 10px 14px;
      font-size: .95rem;
      resize: none;
      outline: none;
      font-family: inherit;
      max-height: 140px;
      overflow-y: auto;
      line-height: 1.45;
    }
    #user-input:focus { border-color: #10a37f; }

    #send-btn {
      background: #10a37f;
      color: #fff;
      border: none;
      border-radius: 10px;
      padding: 0 18px;
      cursor: pointer;
      font-size: 1.2rem;
      flex-shrink: 0;
      align-self: flex-end;
      height: 44px;
    }
    #send-btn:disabled { opacity: .5; cursor: default; }
    #send-btn:not(:disabled):hover { background: #0d8f6e; }
  </style>
</head>
<body>
<div class="chat-container">
  <header>
    <h1>GPT Chatbot</h1>
    <button id="reset-btn">New chat</button>
  </header>

  <div id="messages"></div>

  <form id="chat-form">
    <textarea
      id="user-input"
      rows="1"
      placeholder="Type a message… (Enter to send, Shift+Enter for newline)"
      autofocus
    ></textarea>
    <button id="send-btn" type="submit">&#9658;</button>
  </form>
</div>

<script>
  const messagesEl = document.getElementById("messages");
  const form = document.getElementById("chat-form");
  const input = document.getElementById("user-input");
  const sendBtn = document.getElementById("send-btn");
  const resetBtn = document.getElementById("reset-btn");

  function scrollBottom() {
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function addMessage(role, text) {
    const el = document.createElement("div");
    el.className = `message ${role}`;
    el.textContent = text;
    messagesEl.appendChild(el);
    scrollBottom();
    return el;
  }

  function showTyping() {
    const el = document.createElement("div");
    el.className = "typing";
    el.innerHTML = "<span></span><span></span><span></span>";
    el.id = "typing-indicator";
    messagesEl.appendChild(el);
    scrollBottom();
  }

  function removeTyping() {
    document.getElementById("typing-indicator")?.remove();
  }

  async function sendMessage() {
    const text = input.value.trim();
    if (!text) return;

    input.value = "";
    input.style.height = "auto";
    sendBtn.disabled = true;

    addMessage("user", text);
    showTyping();

    try {
      const res = await fetch("/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ message: text }),
      });
      const data = await res.json();
      removeTyping();
      if (data.reply) {
        addMessage("assistant", data.reply);
      } else {
        addMessage("error", data.error || "Something went wrong.");
      }
    } catch {
      removeTyping();
      addMessage("error", "Network error — please try again.");
    } finally {
      sendBtn.disabled = false;
      input.focus();
    }
  }

  form.addEventListener("submit", (e) => {
    e.preventDefault();
    sendMessage();
  });

  input.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  });

  // Auto-grow textarea
  input.addEventListener("input", () => {
    input.style.height = "auto";
    input.style.height = input.scrollHeight + "px";
  });

  resetBtn.addEventListener("click", async () => {
    await fetch("/reset", { method: "POST" });
    messagesEl.innerHTML = "";
  });
</script>
</body>
</html>
